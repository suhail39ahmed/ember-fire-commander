# Deploy ember-api to Cloud Run (manual trigger only).
# Lives at REPO ROOT .github/workflows/ (moved out of infra/, see README).
#
# One-time setup (after `terraform apply` with enable_github_wif = true):
#   GitHub repo > Settings > Secrets and variables > Actions > Variables:
#     GCP_PROJECT_ID    = <project id>
#     GCP_WIF_PROVIDER  = terraform output -raw github_wif_provider
#     GCP_DEPLOYER_SA   = terraform output -raw github_deployer_sa
# No JSON keys: GitHub's OIDC token is exchanged through Workload Identity Federation.
name: deploy-api

on:
  workflow_dispatch:
    inputs:
      ref_note:
        description: "Why are you deploying? (free text, shows in the run log)"
        required: false
        default: "manual deploy"

permissions:
  contents: read
  id-token: write # needed to mint the OIDC token for WIF

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  REGION: asia-southeast1
  REPO: ember
  SERVICE: ember-api
  SOURCE_DIR: services/api

jobs:
  deploy:
    runs-on: ubuntu-latest
    # WIF only trusts refs/heads/main by default (terraform var github_allowed_ref).
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${REPO}/${SERVICE}:${GITHUB_SHA::12}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" "$SOURCE_DIR"
          docker push "$IMAGE"

      - name: Deploy to Cloud Run (image only; Terraform owns the rest)
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          env_vars: |
            FIRESTORE_DATABASE=ember-db
            EMBER_FIRESTORE_DB=ember-db
          flags: "--service-account=sa-ember-api@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com"

      - name: Show URL
        run: gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)'
